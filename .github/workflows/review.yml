name: Code review

# Reusable workflow that runs `claude -p` directly with a heartbeat watchdog
# and a bounded review budget, posting the result as a single formal PR review
# (approve when clean, request-changes with inline findings otherwise).
# Designed to be called from a consumer repo's CI workflow via `uses:`.
#
# The reviewer is always the Claude Code CLI. Which model actually serves the
# request is a matter of which provider it points at: 'anthropic' talks to
# Anthropic's own API, 'qwen' points the CLI at Alibaba's Qwen Token Plan
# endpoint, 'openrouter' at OpenRouter's, and 'zai' at Z.AI's GLM Coding Plan -
# the latter three speak the native Anthropic Messages protocol, so the same
# CLI, tool policy and prompt work unmodified against all four; only the base
# URL, auth token and default model differ.
#
# Provider and model are fleet-wide by default, not per-repo: every run
# fetches fleet.json from this repo's own main branch (unauthenticated raw
# fetch, since this repo is public) for the live default `provider` and
# `tier` ('high'/'medium'/'low', mapped to a concrete model per provider).
# Editing that one file is what "switch every repo over, I've run out of
# tokens" means in practice - no per-repo commits or variables. A calling
# repo can still override provider/tier for itself via the `provider`/`tier`
# inputs or its own CODE_REVIEW_PROVIDER/CODE_REVIEW_TIER variables, and an
# explicit `model` always wins outright over tier mapping - but neither is
# needed for the normal case.
#
# Consumers:
#   jobs:
#     code_review:
#       if: ${{ github.event_name == 'pull_request' }}
#       uses: degory/ghul-code-review/.github/workflows/review.yml@v4
#       with:
#         prompt: |
#           Review pull request #${{ github.event.pull_request.number }} ...
#       secrets:
#         claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#         qwen-auth-token: ${{ secrets.QWEN_AUTH_TOKEN }}

on:
  workflow_call:
    inputs:
      prompt:
        description: "Full text of the review brief to send claude (-p)."
        type: string
        required: true
      provider:
        description: >-
          Which provider serves the review: 'anthropic' (Claude models via
          Anthropic's own API), 'qwen' (Alibaba's Qwen Token Plan, Anthropic-
          compatible endpoint), or 'openrouter' (OpenRouter's Anthropic-
          compatible endpoint, any catalog model), or 'zai' (Z.AI's GLM Coding
          Plan). All four run through the same claude CLI - only the base URL,
          auth token and default model differ. Empty string (the normal case) falls back to the calling
          repo's CODE_REVIEW_PROVIDER variable, then this repo's own
          fleet.json (fetched fresh each run - see the notes at the top of
          this file), then 'anthropic'. Set this input, or the repo variable,
          only to pin one repo away from the fleet default.
        type: string
        default: ""
      tier:
        description: >-
          A provider-independent quality/cost tier - 'high', 'medium' or
          'low' - mapped to a concrete model by fleet.json's `models` table
          for whichever provider is active. Empty string falls back to the
          calling repo's CODE_REVIEW_TIER variable, then fleet.json's own
          default tier, then 'medium'.
        type: string
        default: ""
      model:
        description: >-
          Explicit model id passed to --model, bypassing tier mapping
          entirely. Leave empty (the normal case) to resolve from `tier`
          instead - this is only for pinning a specific model fleet.json's
          tier table doesn't cover.
        type: string
        default: ""
      allowed-tools:
        description: "Comma-separated --allowedTools argument."
        type: string
        default: "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh api:*),Bash(date:*),Bash(git log:*),Bash(wc:*),Read,Write,Glob,Grep"
      disallowed-tools:
        description: >-
          Space-separated --disallowedTools argument. allowed-tools is a permission
          allowlist, not a capability restriction: tools that never prompt stay
          reachable however narrow it is. A review that fans out to subagents
          multiplies its own token cost and runs out of wall clock before it posts
          anything, so the orchestration tools are denied outright.
        type: string
        default: "Agent Workflow Task"
      runner:
        description: >-
          GitHub Actions runner label the review job runs on. A small runner
          suffices - the job spends its time waiting on the model, not building.
          Defaults to a small Ubicloud runner, because GitHub's own runners do not
          always reach the Qwen Token Plan or OpenRouter endpoints.
        type: string
        default: ubicloud-standard-2
      idle-timeout-seconds:
        description: >-
          Kill claude if its stdout doesn't grow for this many seconds. Must
          comfortably exceed the model's time-to-first-token on a cold start -
          higher than a direct-Anthropic default needs, because the qwen and
          openrouter proxies add their own latency.
        type: number
        default: 180
      max-attempts:
        description: >-
          Maximum attempts before giving up. Defaults to 1: a retry re-reads the
          whole PR from a fresh context, so it competes with the surviving attempts
          for one shared job budget rather than adding to it. Failing the check and
          letting a push re-trigger the review is cheaper than a second attempt that
          gets guillotined mid-flight.
        type: number
        default: 1
      post-findings-after-minutes:
        description: >-
          Soft deadline handed to the review as a wall-clock instruction: reach a
          posted review by this point, whatever depth has been achieved. The outer
          job timeout is a backstop for a wedged run, not the working budget.
        type: number
        default: 4
      transcript-retention-days:
        description: >-
          Retention for the uploaded review transcript. The full event stream carries
          every file the review read, so it is large and its value decays quickly -
          long enough to investigate a bad run, not to accumulate.
        type: number
        default: 14
      claude-version:
        description: "Claude CLI version to install on the runner."
        type: string
        default: "2.1.221"
      job-timeout-minutes:
        description: "Outer job timeout-minutes (belt-and-braces on top of the idle watchdog)."
        type: number
        default: 12
      gh-app-id:
        description: "Optional GitHub App id. When supplied alongside gh-app-private-key, the review posts under this App's installation identity instead of github-actions[bot]."
        type: string
        default: ""
      ghul-reference:
        description: "Fetch GHUL.md from degory/ghul main into the workspace root, for repos whose diffs contain ghūl source. The prompt can then point the review at it."
        type: boolean
        default: false
      style-reference:
        description: "Fetch STYLE.md from degory/ghul-style main into the workspace root, for repos whose diffs carry human-facing prose or example code. Requires gh-app-id, and ghul-style named in extra-repositories."
        type: boolean
        default: false
      extra-repositories:
        description: "Additional repository names (newline- or comma-separated, same owner) the App token should reach, for prompts that read a file from a sibling repo. The calling repository is always included."
        type: string
        default: ""
    secrets:
      claude-oauth-token:
        description: "OAuth token for Anthropic's own API (CLAUDE_CODE_OAUTH_TOKEN). Required when provider resolves to 'anthropic'."
        required: false
      qwen-auth-token:
        description: "API key for Alibaba's Qwen Token Plan endpoint. Required when provider resolves to 'qwen'."
        required: false
      openrouter-auth-token:
        description: "API key for OpenRouter. Required when provider resolves to 'openrouter'."
        required: false
      zai-auth-token:
        description: "API key for Z.AI's GLM Coding Plan endpoint. Required when provider resolves to 'zai'."
        required: false
      gh-app-private-key:
        description: "Optional PEM-format private key for the GitHub App identified by gh-app-id. Required only if gh-app-id is set."
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Code review
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    # The review is part of the merge gate, so a failure here fails the run.
    # A review that could not be posted leaves the diff unreviewed, which is
    # not a state to merge from — better to block and re-run than to let it
    # through on the strength of CI alone.
    env:
      # Raw, unfallen-back values only - the full anthropic/medium fallback
      # chain runs in the "Resolve provider, tier and credentials" step below,
      # because fleet.json (fetched there) sits between the repo-level
      # override and the hardcoded last resort.
      PROVIDER_OVERRIDE: ${{ inputs.provider || vars.CODE_REVIEW_PROVIDER }}
      TIER_OVERRIDE: ${{ inputs.tier || vars.CODE_REVIEW_TIER }}
      MODEL_OVERRIDE: ${{ inputs.model }}
      PROMPT: ${{ inputs.prompt }}
      ALLOWED_TOOLS: ${{ inputs.allowed-tools }}
      DISALLOWED_TOOLS: ${{ inputs.disallowed-tools }}
      POST_AFTER_MIN: ${{ inputs.post-findings-after-minutes }}
      IDLE_TIMEOUT_S: ${{ inputs.idle-timeout-seconds }}
      MAX_ATTEMPTS: ${{ inputs.max-attempts }}
      CLAUDE_VERSION: ${{ inputs.claude-version }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Mint App installation token
      id: app-token
      if: ${{ inputs.gh-app-id != '' }}
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.gh-app-id }}
        private-key: ${{ secrets.gh-app-private-key }}
        # The action scopes the token to the calling repository alone unless
        # told otherwise, so a prompt that reads from a sibling repo gets a 404
        # until that repo is named here.
        owner: ${{ github.repository_owner }}
        repositories: |
          ${{ github.event.repository.name }}
          ${{ inputs.extra-repositories }}

    - name: Fetch GHUL.md language reference
      if: ${{ inputs.ghul-reference }}
      run: curl -fsSL https://raw.githubusercontent.com/degory/ghul/main/GHUL.md -o GHUL.md

    # ghul-style is private, so this needs the App token widened to reach it.
    # Doing it here rather than from the prompt because the CLI's write guard
    # refuses the shell redirection a prompt-driven fetch would need.
    - name: Fetch STYLE.md style guide
      if: ${{ inputs.style-reference }}
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
      run: |
        gh api repos/degory/ghul-style/contents/STYLE.md -H "Accept: application/vnd.github.raw" > STYLE.md

    - name: Pre-fetch PR context
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        mkdir -p .review-context

        # GitHub's diff endpoint refuses any diff of more than 300 files, so a
        # large mechanical change - a mass rename, a sweeping cleanup - would
        # otherwise fail the whole review rather than be reviewed. The checkout
        # is the pull request's merge commit, so diffing it against the base
        # commit reproduces the same changes. The history has to be deepened
        # first, which is why that is done here and not by checking out in full:
        # every other review pays for a shallow clone and only this path does
        # not.
        if ! gh pr diff "$PR_NUMBER" --repo "$REPO" > .review-context/diff.patch 2>.review-context/diff.err ; then
          if grep -q "exceeded the maximum number of files" .review-context/diff.err ; then
            echo "diff exceeds GitHub's 300 file limit; computing it locally"
            git fetch --quiet --unshallow 2>/dev/null || git fetch --quiet --deepen=2000 2>/dev/null || true
            git fetch --quiet origin "$BASE_SHA" 2>/dev/null || true
            git diff "$BASE_SHA" HEAD > .review-context/diff.patch
          else
            cat .review-context/diff.err >&2
            exit 1
          fi
        fi
        rm -f .review-context/diff.err

        gh pr view   "$PR_NUMBER" --repo "$REPO" \
          --json number,title,body,baseRefName,headRefName,additions,deletions,changedFiles,author,labels,commits \
          > .review-context/pr.json
        gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" > .review-context/comments.json
        gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews"   > .review-context/reviews.json
        gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments"  > .review-context/review-comments.json
        echo "Pre-fetched PR context:"
        ls -lh .review-context/

    # A human reviewer's judgment on this PR takes precedence permanently,
    # not just until the next push: once anyone who isn't a bot has approved
    # at any point in the PR's history, every later run skips the automated
    # review outright rather than re-litigating it. Skipping (not posting a
    # fresh approval) is what makes this work — the bot's own last review
    # stays whatever it already was, so it can't override the human
    # reviewer's still-active approval in the aggregate review decision.
    - name: Check for a prior human approval
      id: human_approval
      if: github.event_name == 'pull_request'
      run: |
        set -euo pipefail
        found=$(jq -r '[.[] | select(.user.type != "Bot" and .state == "APPROVED")] | length > 0' .review-context/reviews.json)
        echo "found=${found}" >> "$GITHUB_OUTPUT"
        if [ "$found" = "true" ]; then
          echo "::notice::a human reviewer has already approved this PR — skipping the automated review"
        fi

    # Resolves the fleet-wide default provider/tier, then which credentials
    # and concrete model the rest of the job uses. Only the secret the
    # selected provider actually needs is read here, so an unconfigured
    # provider's empty secret never reaches an env var at all. Written via
    # $GITHUB_ENV rather than a step `env:` block, because a value produced
    # here has to reach later steps' real process environment (the claude CLI
    # itself reads ANTHROPIC_BASE_URL/ANTHROPIC_AUTH_TOKEN from there) - the
    # static `${{ env.* }}` expression context does not see anything written
    # to $GITHUB_ENV at runtime, only values declared in a workflow/job/step
    # `env:` key.
    - name: Resolve provider, tier and credentials
      id: provider
      if: steps.human_approval.outputs.found != 'true'
      env:
        CLAUDE_OAUTH_TOKEN: ${{ secrets.claude-oauth-token }}
        QWEN_AUTH_TOKEN: ${{ secrets.qwen-auth-token }}
        OPENROUTER_AUTH_TOKEN: ${{ secrets.openrouter-auth-token }}
        ZAI_AUTH_TOKEN: ${{ secrets.zai-auth-token }}
      run: |
        set -euo pipefail

        # Fleet-wide defaults, fetched fresh every run. Unauthenticated raw
        # fetch works because this repo is public - editing fleet.json on
        # main and pushing is the single switch that moves every consumer
        # repo's next review run, with no per-repo commit or variable.
        FLEET_JSON=$(curl -fsSL --max-time 10 https://raw.githubusercontent.com/degory/ghul-code-review/main/fleet.json 2>/dev/null || true)
        if [ -z "$FLEET_JSON" ] || ! echo "$FLEET_JSON" | jq -e . >/dev/null 2>&1; then
          echo "::warning::could not fetch or parse fleet.json - falling back to this workflow's own built-in defaults"
          FLEET_JSON='{}'
        fi
        FLEET_PROVIDER=$(echo "$FLEET_JSON" | jq -r '.provider // empty')
        FLEET_TIER=$(echo "$FLEET_JSON" | jq -r '.tier // empty')

        PROVIDER="${PROVIDER_OVERRIDE:-${FLEET_PROVIDER:-anthropic}}"
        TIER="${TIER_OVERRIDE:-${FLEET_TIER:-medium}}"

        # Used only when fleet.json doesn't cover [provider][tier] - a fetch
        # failure, or a tier name fleet.json hasn't been given a model for.
        fallback_model() {
          case "$1:$2" in
            anthropic:high)    echo claude-opus-5 ;;
            anthropic:medium)  echo claude-sonnet-5 ;;
            anthropic:low)     echo claude-haiku-4-5 ;;
            qwen:high)         echo qwen3.8-max ;;
            qwen:medium)       echo qwen3.7-max ;;
            qwen:low)          echo qwen3.6-flash ;;
            openrouter:high)   echo z-ai/glm-5.2 ;;
            openrouter:medium) echo z-ai/glm-4.7 ;;
            openrouter:low)    echo z-ai/glm-4.7-flash ;;
            zai:high)          echo glm-5.2 ;;
            zai:medium)        echo glm-5.2 ;;
            zai:low)           echo glm-4.7 ;;
            *) echo "" ;;
          esac
        }

        if [ -n "$MODEL_OVERRIDE" ]; then
          MODEL="$MODEL_OVERRIDE"
        else
          MODEL=$(echo "$FLEET_JSON" | jq -r --arg p "$PROVIDER" --arg t "$TIER" '.models[$p][$t] // empty')
          [ -n "$MODEL" ] || MODEL=$(fallback_model "$PROVIDER" "$TIER")
          if [ -z "$MODEL" ]; then
            echo "::error::no model resolvable for provider=$PROVIDER tier=$TIER - not in fleet.json and no built-in fallback for this tier; use tier 'high'/'medium'/'low' or set 'model' explicitly"
            exit 1
          fi
        fi

        case "$PROVIDER" in
          anthropic)
            [ -n "$CLAUDE_OAUTH_TOKEN" ] || { echo "::error::provider resolved to 'anthropic' but the claude-oauth-token secret is empty"; exit 1; }
            echo "CLAUDE_CODE_OAUTH_TOKEN=$CLAUDE_OAUTH_TOKEN" >> "$GITHUB_ENV"
            ;;
          qwen)
            [ -n "$QWEN_AUTH_TOKEN" ] || { echo "::error::provider resolved to 'qwen' but the qwen-auth-token secret is empty"; exit 1; }
            echo "ANTHROPIC_AUTH_TOKEN=$QWEN_AUTH_TOKEN" >> "$GITHUB_ENV"
            echo "ANTHROPIC_BASE_URL=https://token-plan.ap-southeast-1.maas.aliyuncs.com/apps/anthropic" >> "$GITHUB_ENV"
            ;;
          openrouter)
            [ -n "$OPENROUTER_AUTH_TOKEN" ] || { echo "::error::provider resolved to 'openrouter' but the openrouter-auth-token secret is empty"; exit 1; }
            echo "ANTHROPIC_AUTH_TOKEN=$OPENROUTER_AUTH_TOKEN" >> "$GITHUB_ENV"
            echo "ANTHROPIC_BASE_URL=https://openrouter.ai/api" >> "$GITHUB_ENV"
            ;;
          zai)
            [ -n "$ZAI_AUTH_TOKEN" ] || { echo "::error::provider resolved to 'zai' but the zai-auth-token secret is empty"; exit 1; }
            echo "ANTHROPIC_AUTH_TOKEN=$ZAI_AUTH_TOKEN" >> "$GITHUB_ENV"
            echo "ANTHROPIC_BASE_URL=https://api.z.ai/api/anthropic" >> "$GITHUB_ENV"
            # Z.AI's Coding Plan can queue a request far longer than the CLI's
            # default timeout; without raising it a queued review times out and
            # loses the turn before the model ever responds.
            echo "API_TIMEOUT_MS=3000000" >> "$GITHUB_ENV"
            ;;
          *)
            echo "::error::unknown provider '$PROVIDER' - expected anthropic, qwen, openrouter or zai"
            exit 1
            ;;
        esac
        echo "PROVIDER=$PROVIDER" >> "$GITHUB_ENV"
        echo "TIER=$TIER" >> "$GITHUB_ENV"
        echo "MODEL=$MODEL" >> "$GITHUB_ENV"
        echo "::notice::code review provider=$PROVIDER tier=$TIER model=$MODEL"

    - name: Install claude CLI
      if: steps.human_approval.outputs.found != 'true'
      run: |
        curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_VERSION"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run review with live progress and heartbeat watchdog
      if: steps.human_approval.outputs.found != 'true'
      shell: bash
      env:
        # If the caller passed App credentials, post under the App's installation identity.
        # Otherwise fall back to the default GITHUB_TOKEN (github-actions[bot]).
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
      run: |
        set -uo pipefail

        # Each stream-json event -> one summary line in the live job log.
        # Raw JSON still goes to the watchdog's file so it can detect silence.
        progress_filter() {
          jq -r --unbuffered '
            def trunc($n): if (.|tostring|length) > $n then (.|tostring)[0:$n] + "…" else (.|tostring) end;
            def squash: gsub("\\s+"; " ");
            if .type == "system" and .subtype == "init" then
              "[init] model=\(.model // "?") tools=\((.tools // []) | length)"
            elif .type == "system" and .subtype == "thinking_tokens" then
              "[thinking_raw] \(.estimated_tokens // 0)"
            elif .type == "system" then
              "[system/\(.subtype // "?")] " + ((. | del(.type, .subtype, .session_id, .uuid, .parent_tool_use_id) | tostring) | gsub("\\s+"; " ") | .[0:180])
            elif .type == "assistant" then
              (.message.content // [] | map(
                if .type == "text" then
                  "[text] " + (.text | squash | trunc(180))
                elif .type == "tool_use" then
                  "[tool] \(.name) " + ((.input // {} | tostring) | squash | trunc(180))
                else "[\(.type)]" end
              ) | .[])
            elif .type == "user" then
              (.message.content // [] | map(
                if .type == "tool_result" then
                  (.content as $c
                   | (if ($c | type) == "array" then ($c | map(.text // "") | join(" "))
                      elif ($c | type) == "string" then $c
                      else ($c | tostring) end)
                   | squash | trunc(180)
                   | "[result] " + .)
                else "[\(.type)]" end
              ) | .[])
            elif .type == "result" then
              "[done/\(.subtype)] turns=\(.num_turns // "?") cost_usd=\(.total_cost_usd // "?") duration_ms=\(.duration_ms // "?")"
            else
              "[\(.type // "?")]"
            end
          ' 2>/dev/null || true
        }

        LOG_DIR="${RUNNER_TEMP}/review-logs"
        mkdir -p "$LOG_DIR"

        # One row per attempt in the job summary, so the shape of a run is readable
        # without downloading anything. The stream is JSONL with stderr interleaved,
        # so every line is parsed defensively and unparseable ones are dropped.
        scorecard() {
          local attempt=$1 f=$2 rc=$3 idle=$4
          local j
          j=$(jq -R 'fromjson? // empty' < "$f" 2>/dev/null | jq -s '.' 2>/dev/null) || j='[]'
          [ -n "$j" ] || j='[]'

          local q='[.[]|select(.type=="assistant")|.message.content[]?|select(.type=="tool_use")]'
          local tools names fanout refused posted cost dur turns
          tools=$(echo "$j"  | jq -r "$q|length")
          names=$(echo "$j"  | jq -r "$q|map(.name)|group_by(.)|map(\"\(.[0])×\(length)\")|join(\", \")")
          fanout=$(echo "$j" | jq -r "$q|map(select(.name|test(\"^(Agent|Workflow|Task)\$\")))|length")
          posted=$(echo "$j" | jq -r "$q|map(select((.input|tostring)|test(\"/reviews|pr review\")))|length")
          refused=$(echo "$j" | jq -r '[.[]|select(.type=="user")|.message.content[]?|select(.type=="tool_result")|(.content|tostring)|select(test("requires approval|Review dynamic workflow"))]|length')
          cost=$(echo "$j"   | jq -r '[.[]|select(.type=="result")]|last|.total_cost_usd // "?"')
          dur=$(echo "$j"    | jq -r '[.[]|select(.type=="result")]|last|.duration_ms // 0')
          turns=$(echo "$j"  | jq -r '[.[]|select(.type=="result")]|last|.num_turns // "?"')

          if [ "$attempt" = "1" ]; then
            printf '### Review run (provider=%s tier=%s model=%s)\n\n' "$PROVIDER" "$TIER" "$MODEL"
            printf '| attempt | outcome | duration | turns | tool calls | fan-out | refused | posted | cost |\n'
            printf '|---|---|---|---|---|---|---|---|---|\n'
          fi
          printf '| %s | rc=%s%s | %ss | %s | %s | %s | %s | %s | $%s |\n' \
            "$attempt" "$rc" "$([ "$idle" = "true" ] && echo ' idle-killed')" \
            "$(( dur / 1000 ))" "$turns" "$tools" "$fanout" "$refused" "$posted" "$cost"
          [ -n "$names" ] && printf '\n%s\n' "$names"
        }

        # An absolute wall-clock deadline, not a duration: elapsed time is otherwise
        # unobservable from inside the run, which makes any "finish within N minutes"
        # instruction unactionable. Bash(date:*) is in the default allowlist so the
        # deadline can actually be checked against the clock.
        POST_BY=$(date -u -d "+${POST_AFTER_MIN} minutes" +'%H:%M:%SZ')
        STARTED_AT=$(date -u +'%H:%M:%SZ')

        # Append a small note about sandbox/CLI quirks and the canonical posting command
        # so each caller doesn't repeat them. The model has historically picked the wrong
        # gh subcommand (issue comment vs. formal PR review) without explicit instruction.
        FULL_PROMPT="$PROMPT

        Time budget:
        - This run started at ${STARTED_AT} and must have posted its review by ${POST_BY} (UTC, currently ${POST_AFTER_MIN} minutes). Check the clock with 'date -u' whenever you are unsure how much of it you have used.
        - That deadline is the working budget, not an emergency stop. The runner kills the job a few minutes later, and a killed run posts nothing at all: no review, a failed check, and a PR blocked on work nobody can read. A shallower review that gets posted beats a deeper one that does not.
        - Depth is yours to spend against that budget. Read what the diff makes you want to read, then stop and post. If the budget is nearly gone, post what you have — a review covering the changes you did read is a complete review, not a partial one.
        - Do not delegate to subagents or parallel workers. They are disabled: they multiply token cost, and coordinating them is what exhausts the budget before anything reaches the PR. One reviewer, reading directly.

        Tools:
        - Read, Grep and Glob are how you read the diff and the tree. Read takes offset and limit, so a large file is a couple of targeted calls rather than a series of overlapping shell slices.
        - Bash is restricted to 'gh', 'date', 'git log' and 'wc'. Anything else is refused, and nobody is present to approve it: a refused command fails outright, and the attempt costs budget whether or not it runs.
        - So do not probe for what the shell will accept. If a command is refused, do not retry it, rephrase it, or look for an equivalent that might get through — reach the same conclusion with Read, Grep and Glob, or decide without it and say what you could not check.

        Runtime notes:
        - PR context is pre-fetched in ./.review-context/ — use Read (or Grep) on these files instead of refetching with 'gh pr diff' / 'gh pr view' / 'gh api':
            .review-context/diff.patch          — full unified diff
            .review-context/pr.json             — PR metadata (title, body, author, base/head refs, file counts, commits, labels)
            .review-context/comments.json       — top-level issue comments on the PR
            .review-context/reviews.json        — prior PR reviews (use to acknowledge already-resolved findings, avoid duplicates)
            .review-context/review-comments.json — prior inline review comments
        - Post exactly one formal PR Review per run. The event is a binary choice on whether you are raising anything at all:
            - Nothing to raise -> approve: gh pr review <PR-number> --approve --body \"LGTM\". Approval is the merge signal (branch protection can require an approving review of the latest changes and auto-merge waits on it), so always post it explicitly rather than staying silent — a skipped review is indistinguishable from a stuck bot.
            - One or more findings, of any severity -> write a JSON file (e.g. review.json) and POST it via the reviews endpoint with event REQUEST_CHANGES:
                gh api repos/<OWNER>/<REPO>/pulls/<PR-number>/reviews -X POST --input review.json
              The JSON shape:
                {
                  \"event\": \"REQUEST_CHANGES\",
                  \"body\": \"<optional cross-cutting summary; can be empty>\",
                  \"comments\": [
                    {\"path\": \"<repo-relative file>\", \"line\": <new-side line number>, \"body\": \"<finding>\"},
                    ...
                  ]
                }
              One finding per 'comments[]' entry, anchored to the specific line; use 'body' only for cross-cutting commentary that doesn't belong on one line. The default 'side' is RIGHT (the new version of the file); add \"side\": \"LEFT\" only when anchoring to a deletion.
              Every 'comments[]' entry must anchor to a line that appears in this PR's diff. The endpoint rejects the whole POST with a 422 if any single entry falls outside the diff hunks, discarding every other finding with it — so a finding about code the diff doesn't touch goes in 'body', not on a line.
        - Never use event COMMENT (it does not satisfy branch protection, so the PR sits stuck) and never event APPROVE carrying inline findings (auto-merge can land the PR before the author reads what you flagged). If a finding is worth posting it is REQUEST_CHANGES; if it is not, stay silent and approve. A caveat you would attach to an approval is itself a finding — drop the approval and raise it.
        - Do NOT use 'gh pr comment' — that creates an issue comment, not a review.
        - The working directory (e.g. /home/runner/work/<repo>/<repo>) is writeable — Write the JSON there. /tmp is NOT writeable.
        - JSON 'body' fields can contain markdown (including '# headings') — the '#'-at-line-start guard only applies to command-line --body arguments, not to file contents POSTed via --input.

        What you are reading vs. what CI gates:
        - You run in parallel with CI, not after it, so its jobs can still be in flight. Whether the diff builds, compiles and passes tests is settled by CI and branch protection before anything merges — that is not your job. Trust the diff as written: do not try to mentally compile it, run tests, or verify reproducibility. Spend your attention on what the test suite cannot catch even when it passes.

        What to say:
        - Group inline findings by severity: prefix each with **Bug**, **Concern** or **Nit** so severity is scannable. Severity is a reading-order aid; it does not change whether you request changes.
        - Raise a finding only when it would change what a careful maintainer does. Not style preferences the codebase does not share, not speculative refactors, not restatements of what the diff plainly does, not hypotheticals without a concrete path. Silence on a low-confidence finding beats noise — the job is high-signal feedback, not exhaustive enumeration.
        - Every finding blocks the PR, so apply that test before writing it down: is this worth holding the merge for until someone fixes it? If yes, raise it. If no, drop it entirely. There is no third outcome — nobody comes back to fix something the review mentioned in passing and merged anyway, so a finding you would not block on is one you should not have spent the words on.
        - Do not soft-pedal. If a finding is worth saying, say it as a finding; if it is not, stay silent. Closing notes like 'non-blocking, but…', 'minor nit (no action)' or 'consider…' do not fit this workflow, because by the time the author reads them the PR can already have merged.
        - The categories below are what counts as a finding when you meet one, not a checklist to work through or a quota to fill. Read the diff, follow what it makes you curious about, and report what you actually found. A category you had no reason to look into is not a gap in the review, and hunting for something to say under each heading produces exactly the low-value findings the previous points rule out.
        - Docs-only and workflow-only changes are held to the same bar as code. They ship as permanently as code does, and several repos generate their release notes from the squash-merge message. The same bar is not the same amount of work: a small prose or configuration change usually warrants nothing, and reaching that conclusion quickly is the bar being applied, not skipped.
        - A routine mechanical change — a dependency or tool-version bump, a lockfile update, a generated-file refresh — is read for what makes it non-routine: a major-version jump, a change that needs a matching update elsewhere, an edit smuggled in alongside the mechanical one. Finding none of those, approve and move on rather than looking for something to say.
        - An approval with no findings is a good outcome and a common one. It is the review working, not the review giving up, and it is what lets a clean PR merge. Do not treat an empty findings list as a sign you have not looked hard enough.

        Source comment hygiene:
        - Comments must stand on their own for a reader who knows the repo but has none of the surrounding context — no PR thread, no issue, no private notes. The default position is no comment; comment where a competent reader would genuinely need context, such as a non-obvious invariant, a subtle ordering requirement, or a workaround whose reason is not visible from the code.
        - Flag comments that narrate what changed ('new in this branch', 'the fix', 'previously we…'), cite issues or PRs as explanation, justify the code against an earlier attempt, run excessively long, or read as one half of a conversation.

        PR description:
        - The description becomes the squash-merge commit message and the changelog entry, and ships permanently. Plain '-' bullets under 'Enhancements:' (things a consumer of this repo would notice), 'Bugs fixed:' (describe what was broken; reuse an issue's exact title with '(closes #NNNN)' where there is one), or 'Technical:' (internal changes). At least one section; any can be omitted.
        - Flag: '## Summary' / '## Test plan' / '## Testing' headings (the description is the summary), marketing tone, defensive prose that pre-empts a reviewer's question rather than recording what changed, local test results ('all tests pass locally' — CI is the proof), a 'Co-authored-by:' trailer in the body (squash-merge appends a deduped one), internal labels ('phase 2 of…', 'predecessor branch', 'option B'), and private or ephemeral references such as internal workplans, chat threads or session URLs. Public sibling-repo references are fine where they convey a real cross-repo dependency.

        Versioning:
        - Default is patch. A non-patch release is cut by raising the VERSION file in the PR; '#minor'/'#major' markers in the PR body are no-ops, so do not suggest adding them. A workflow_dispatch version input overrides outright, for emergencies.
        - Flag both directions: a breaking change going out without raising VERSION to a major, new public API without raising it to a minor, and a VERSION raise the change does not merit. What counts as breaking for this particular repo is in its review brief."

        for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
          echo "::group::Attempt ${attempt}/${MAX_ATTEMPTS}"
          # Kept for the artifact rather than discarded: the live log truncates every
          # event to 180 characters, so the reasoning behind a verdict survives nowhere
          # else. An approval is four characters and tells you nothing about what was
          # weighed to reach it.
          OUT="${LOG_DIR}/stream-attempt-${attempt}.json"

          claude \
            --model "$MODEL" \
            --verbose \
            --output-format stream-json \
            --add-dir "$PWD" \
            --allowedTools "$ALLOWED_TOOLS" \
            --disallowedTools "$DISALLOWED_TOOLS" \
            -p "$FULL_PROMPT" > "$OUT" 2>&1 &
          CLAUDE_PID=$!

          # Throttle thinking_tokens to one line per 1000-token milestone.
          # `stdbuf -oL` forces line-buffered stdout on awk — otherwise awk block-buffers
          # when its stdout is a pipe and the whole live log lands at job-exit.
          tail -n +1 -F "$OUT" --pid="$CLAUDE_PID" 2>/dev/null \
            | progress_filter \
            | stdbuf -oL awk 'BEGIN{m=1000} /^\[thinking_raw\] / { n=$2+0; if (n>=m) { print "[thinking] " n " tokens"; while(m<=n) m+=1000 } next } { print }' &
          TAIL_PID=$!

          LAST_SIZE=0
          IDLE=0
          IDLE_KILLED=false
          while kill -0 "$CLAUDE_PID" 2>/dev/null; do
            sleep 5
            SIZE=$(stat -c %s "$OUT" 2>/dev/null || echo 0)
            if [ "$SIZE" = "$LAST_SIZE" ]; then
              IDLE=$((IDLE + 5))
              if [ "$IDLE" -ge "$IDLE_TIMEOUT_S" ]; then
                echo "::warning::no claude stdout for ${IDLE_TIMEOUT_S}s — killing PID ${CLAUDE_PID} and children"
                pkill -TERM -P "$CLAUDE_PID" 2>/dev/null || true
                kill -TERM "$CLAUDE_PID" 2>/dev/null || true
                sleep 2
                pkill -KILL -P "$CLAUDE_PID" 2>/dev/null || true
                kill -KILL "$CLAUDE_PID" 2>/dev/null || true
                IDLE_KILLED=true
                break
              fi
            else
              IDLE=0
              LAST_SIZE=$SIZE
            fi
          done
          wait "$CLAUDE_PID" 2>/dev/null; RC=$?
          wait "$TAIL_PID" 2>/dev/null || true
          echo "::endgroup::"

          # Written per attempt rather than once at the end: a run the runner kills at
          # timeout-minutes is the one whose numbers matter most, and it never reaches
          # the end.
          scorecard "$attempt" "$OUT" "$RC" "$IDLE_KILLED" >> "$GITHUB_STEP_SUMMARY"

          if [ "$IDLE_KILLED" = "false" ] && [ "$RC" -eq 0 ]; then
            echo "::notice::review completed on attempt ${attempt}"
            exit 0
          fi
          echo "::warning::attempt ${attempt} failed (rc=${RC}, idle_killed=${IDLE_KILLED})"
        done

        echo "::error::review not posted after ${MAX_ATTEMPTS} attempt(s) — failing the check so the diff is not merged unreviewed"
        exit 1

    # always(), because the runs worth reading are the ones that failed or were
    # killed. Artifacts are uploaded verbatim and secret masking does not apply to
    # them the way it does to the log, so the provider auth token in use (by its
    # exact value) and any token-shaped strings are redacted first. The token, if
    # any, arrived via $GITHUB_ENV in the credential-resolution step, so it is read
    # here as a plain process env var rather than through the `${{ env.* }}`
    # expression context (which does not see $GITHUB_ENV writes).
    - name: Redact and compress the transcript
      if: always()
      shell: bash
      run: |
        set -uo pipefail
        DIR="${RUNNER_TEMP}/review-logs"
        [ -d "$DIR" ] || { echo "no transcript to upload"; exit 0; }
        REDACT_KEY="${ANTHROPIC_AUTH_TOKEN:-${CLAUDE_CODE_OAUTH_TOKEN:-}}"
        if [ -n "$REDACT_KEY" ]; then
          REDACT_KEY="$REDACT_KEY" find "$DIR" -type f -exec perl -pi -e 's/\Q$ENV{REDACT_KEY}\E/REDACTED/g' {} +
        fi
        if grep -rlE 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-ant-[A-Za-z0-9-]{20,}' "$DIR" >/dev/null 2>&1; then
          echo "::warning::token-shaped strings found in the transcript — redacting before upload"
          find "$DIR" -type f -exec sed -i -E 's/gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-ant-[A-Za-z0-9-]{20,}/REDACTED/g' {} +
        fi
        gzip -9 "$DIR"/*.json 2>/dev/null || true
        ls -lh "$DIR"

    - name: Upload review transcript
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: review-transcript-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/review-logs/
        retention-days: ${{ inputs.transcript-retention-days }}
        if-no-files-found: ignore
